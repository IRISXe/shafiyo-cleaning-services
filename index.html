<style>
:root{
  --navy-950:#050f1f;
  --navy-900:#0a2036;
  --navy-800:#0d2b52;
  --navy-700:#123a6b;
  --royal-600:#1656b3;
  --royal-500:#1f6fe0;
  --cyan-500:#17b8c9;
  --cyan-400:#3ad2e0;
  --cyan-300:#7fe4ec;
  --ink:#0b1526;
  --ink-soft:#4a5568;
  --paper:#ffffff;
  --mist:#f5f8fb;
  --mist-2:#eef3f8;
  --line:rgba(11,21,38,0.09);
  --line-strong:rgba(11,21,38,0.14);
  --gold:#d9a441;
  --shadow-lg: 0 30px 80px -20px rgba(6,20,45,0.35);
  --shadow-md: 0 16px 40px -12px rgba(6,20,45,0.25);
  --ease: cubic-bezier(.22,.61,.36,1);
  --font-ar: 'Tajawal','IBM Plex Sans Arabic',sans-serif;
  --font-en: 'Plus Jakarta Sans','Manrope',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}
html[lang="ar"] body{font-family:var(--font-ar);}
html[lang="en"] body{font-family:var(--font-en);}
body{
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img,video{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
ul{list-style:none;}
.container{width:100%;max-width:1280px;margin-inline:auto;padding-inline:24px;}
@media(min-width:768px){.container{padding-inline:40px;}}
@media(min-width:1200px){.container{padding-inline:56px;}}
 
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700;letter-spacing:.06em;
  color:var(--royal-600);text-transform:uppercase;
  margin-bottom:18px;
}
html[lang="ar"] .eyebrow{letter-spacing:0;}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--cyan-500);display:inline-block;}
.h2{
  font-size:clamp(30px,4.2vw,50px);
  font-weight:800;
  line-height:1.15;
  color:var(--navy-900);
  letter-spacing:-0.01em;
}
html[lang="ar"] .h2{font-weight:800;letter-spacing:0;}
.lead{font-size:clamp(16px,1.6vw,19px);color:var(--ink-soft);max-width:640px;line-height:1.8;}
.section{padding-block:110px;position:relative;}
@media(max-width:768px){.section{padding-block:72px;}}
.section-head{max-width:720px;margin-bottom:56px;}
.section-head.center{margin-inline:auto;text-align:center;}
.section-head.center .eyebrow::before{display:none;}
 
/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease), transform .8s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.reveal-scale{opacity:0;transform:scale(.94);transition:opacity .8s var(--ease), transform .8s var(--ease);}
.reveal-scale.in{opacity:1;transform:scale(1);}
.stagger > *{transition-delay:calc(var(--i,0) * 90ms);}
 
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 30px;border-radius:100px;
  font-weight:700;font-size:15px;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease);
  white-space:nowrap;
}
.btn svg{width:18px;height:18px;flex-shrink:0;transition:transform .3s var(--ease);}
html[dir="rtl"] .btn.arrow svg{transform:scaleX(-1);}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan-500),var(--royal-600));
  color:#fff;box-shadow:0 14px 30px -10px rgba(23,184,201,.55);
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 40px -10px rgba(23,184,201,.65);}
.btn-ghost{
  background:rgba(255,255,255,.08);
  color:#fff;border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(10px);
}
.btn-ghost:hover{background:rgba(255,255,255,.18);transform:translateY(-3px);}
.btn-dark{background:var(--navy-900);color:#fff;}
.btn-dark:hover{background:var(--navy-800);transform:translateY(-3px);}
.btn-outline{border:1.5px solid var(--line-strong);color:var(--navy-900);}
.btn-outline:hover{border-color:var(--cyan-500);background:var(--mist);}
.btn-wa{background:#1fae5b;color:#fff;}
.btn-wa:hover{background:#189249;transform:translateY(-3px);}
.btn-sm{padding:11px 20px;font-size:13.5px;}
 
/* ================= NAVBAR ================= */
.navbar{
  position:fixed;inset-inline:0;top:0;z-index:100;
  padding-block:22px;
  transition:padding .4s var(--ease), background .4s var(--ease), box-shadow .4s var(--ease);
}
.navbar .container{display:flex;align-items:center;justify-content:space-between;gap:20px;}
.navbar.scrolled{
  padding-block:12px;
  background:rgba(8,20,40,0.72);
  backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 10px 30px -14px rgba(0,0,0,.4);
}
.nav-logo{display:flex;align-items:center;gap:12px;}
.nav-logo img{height:60px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
.nav-logo-text{color:#fff;line-height:1.1;}
.nav-logo-text b{display:block;font-size:16px;font-weight:800;letter-spacing:.01em;}
.nav-logo-text span{display:block;font-size:10.5px;opacity:.75;letter-spacing:.06em;text-transform:uppercase;}
.nav-links{display:flex;align-items:center;gap:34px;}
.nav-links a{color:#fff;font-size:14.5px;font-weight:600;position:relative;padding-block:4px;opacity:.92;}
.nav-links a::after{content:"";position:absolute;bottom:-2px;inset-inline:0;height:2px;background:var(--cyan-400);transform:scaleX(0);transition:transform .35s var(--ease);}
.nav-links a:hover::after{transform:scaleX(1);}
.nav-right{display:flex;align-items:center;gap:14px;}
.lang-toggle{
  display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  border-radius:100px;padding:4px;backdrop-filter:blur(6px);
}
.lang-toggle button{
  padding:6px 14px;border-radius:100px;font-size:12.5px;font-weight:700;
  color:rgba(255,255,255,.7);transition:all .3s var(--ease);
}
.lang-toggle button.active{background:#fff;color:var(--navy-900);}
.burger{display:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);align-items:center;justify-content:center;flex-shrink:0;}
.burger span, .burger span::before, .burger span::after{
  content:"";display:block;width:18px;height:2px;background:#fff;border-radius:2px;position:relative;transition:all .3s var(--ease);
}
.burger span::before{position:absolute;top:-6px;width:18px;}
.burger span::after{position:absolute;top:6px;width:18px;}
.burger.open span{background:transparent;}
.burger.open span::before{transform:rotate(45deg);top:0;}
.burger.open span::after{transform:rotate(-45deg);top:0;}
 
.mobile-menu{
  position:fixed;inset:0;z-index:99;background:var(--navy-950);
  display:flex;flex-direction:column;padding:110px 32px 40px;
  transform:translateY(-100%);transition:transform .5s var(--ease);
  overflow-y:auto;
}
.mobile-menu.open{transform:translateY(0);}
.mobile-menu a{color:#fff;font-size:26px;font-weight:800;padding-block:16px;border-bottom:1px solid rgba(255,255,255,.1);}
.mobile-menu .btn{margin-top:28px;justify-content:center;}
 
@media(max-width:960px){
  .nav-links{display:none;}
  .burger{display:flex;}
}
 
/* ================= HERO ================= */
.hero{
  position:relative;min-height:100svh;display:flex;align-items:flex-end;
  overflow:hidden;background:var(--navy-950);
}
.hero-media{position:absolute;inset:0;z-index:0;}
.hero-media video, .hero-media img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.hero-media::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(5,15,31,.55) 0%, rgba(5,15,31,.35) 38%, rgba(5,15,31,.75) 78%, rgba(5,15,31,.94) 100%),
    linear-gradient(90deg, rgba(6,25,50,.55), rgba(6,25,50,.15) 55%);
}
.hero-inner{position:relative;z-index:2;width:100%;padding-block:160px 90px;}
.hero-tag{
  display:inline-flex;align-items:center;gap:10px;color:var(--cyan-300);
  font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 18px;border:1px solid rgba(255,255,255,.25);border-radius:100px;
  background:rgba(255,255,255,.06);backdrop-filter:blur(8px);margin-bottom:28px;
}
html[lang="ar"] .hero-tag{letter-spacing:0;}
.hero-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan-400);box-shadow:0 0 0 4px rgba(58,210,224,.25);}
.hero h1{
  color:#fff;font-weight:900;letter-spacing:-0.02em;
  font-size:clamp(40px,6.4vw,84px);line-height:1.06;max-width:920px;
}
html[lang="ar"] .hero h1{letter-spacing:0;font-weight:800;}
.hero p.sub{
  color:rgba(255,255,255,.82);font-size:clamp(16px,1.7vw,20px);
  max-width:560px;margin-block:26px 40px;line-height:1.8;
}
.hero-ctas{display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
.hero-bottom{
  margin-top:70px;display:flex;justify-content:space-between;align-items:flex-end;
  flex-wrap:wrap;gap:24px;border-top:1px solid rgba(255,255,255,.16);padding-top:26px;
}
.hero-sectors-ticker{display:flex;gap:28px;flex-wrap:wrap;color:rgba(255,255,255,.55);font-size:13px;font-weight:600;letter-spacing:.03em;}
.scroll-indicator{
  display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
.scroll-indicator .line{width:1px;height:36px;background:linear-gradient(var(--cyan-400),transparent);animation:scrollLine 2s infinite var(--ease);}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top;}50%{transform:scaleY(1);transform-origin:top;}51%{transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}
 
@media(max-width:640px){
  .hero-inner{padding-block:130px 60px;}
  .hero-bottom{flex-direction:column;align-items:flex-start;}
}
 
/* ================= ABOUT ================= */
.about-grid{display:grid;grid-template-columns:1fr;gap:60px;align-items:center;}
@media(min-width:960px){.about-grid{grid-template-columns:1fr 1fr;gap:70px;}}
.about-media{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/5;}
.about-media video, .about-media img{width:100%;height:100%;object-fit:cover;}
.about-copy p{color:var(--ink-soft);font-size:16.5px;line-height:1.9;margin-bottom:20px;}
.about-copy p:first-of-type{font-size:19px;color:var(--ink);font-weight:500;line-height:1.75;}
.value-chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}
.value-chip{
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;
  background:var(--mist);border:1px solid var(--line);
}
.value-chip .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan-500),var(--royal-600));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.value-chip .ic svg{width:17px;height:17px;color:#fff;}
.value-chip b{display:block;font-size:13.5px;color:var(--navy-900);}
.value-chip span{font-size:11.5px;color:var(--ink-soft);}
 
/* ================= MISSION / VISION ================= */
.mv-section{background:var(--navy-950);position:relative;overflow:hidden;}
.mv-section::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(700px 400px at 15% 20%, rgba(23,184,201,.14), transparent 60%),
             radial-gradient(700px 500px at 90% 80%, rgba(31,111,224,.18), transparent 60%);
}
.mv-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr;gap:28px;}
@media(min-width:860px){.mv-grid{grid-template-columns:1fr 1fr;}}
.mv-card{
  border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:48px 42px;
  background:rgba(255,255,255,.035);backdrop-filter:blur(6px);
  transition:transform .5s var(--ease), background .5s var(--ease), border-color .5s var(--ease);
}
.mv-card:hover{transform:translateY(-8px);background:rgba(255,255,255,.06);border-color:rgba(58,210,224,.4);}
.mv-card .num{
  font-size:13px;font-weight:800;color:var(--cyan-400);letter-spacing:.1em;text-transform:uppercase;margin-bottom:22px;display:block;
}
.mv-card h3{color:#fff;font-size:28px;font-weight:800;margin-bottom:18px;}
.mv-card p{color:rgba(255,255,255,.72);font-size:16px;line-height:1.85;}
.mv-card .glyph{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;background:linear-gradient(135deg,var(--cyan-500),var(--royal-600));}
.mv-card .glyph svg{width:26px;height:26px;color:#fff;}
 
/* ================= SERVICES ================= */
.services-grid{display:grid;grid-template-columns:1fr;gap:2px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden;}
@media(min-width:720px){.services-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1140px){.services-grid{grid-template-columns:1fr 1fr 1fr;}}
.service-card{
  position:relative;background:#fff;padding:38px 32px;min-height:340px;
  display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
}
.service-card .bg-media{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);}
.service-card .bg-media video, .service-card .bg-media img{width:100%;height:100%;object-fit:cover;}
.service-card .bg-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(6,17,36,.55), rgba(6,17,36,.92));}
.service-card:hover .bg-media{opacity:1;}
.service-card .num{font-size:14px;font-weight:800;color:var(--cyan-500);letter-spacing:.05em;position:relative;z-index:2;transition:color .5s;}
.service-card:hover .num{color:var(--cyan-300);}
.service-card h3{font-size:22px;font-weight:800;color:var(--navy-900);margin-block:16px 12px;position:relative;z-index:2;transition:color .5s;}
.service-card:hover h3{color:#fff;}
.service-card p{font-size:14.5px;color:var(--ink-soft);line-height:1.75;position:relative;z-index:2;transition:color .5s;flex-grow:1;}
.service-card:hover p{color:rgba(255,255,255,.85);}
.service-card .arrow{
  margin-top:22px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;position:relative;z-index:2;
  transition:all .5s var(--ease);flex-shrink:0;
}
.service-card .arrow svg{width:17px;height:17px;transition:transform .4s var(--ease);}
html[dir="rtl"] .service-card .arrow svg{transform:scaleX(-1);}
.service-card:hover .arrow{background:var(--cyan-500);border-color:var(--cyan-500);}
.service-card:hover .arrow svg{color:#fff;transform:translateX(3px);}
html[dir="rtl"] .service-card:hover .arrow svg{transform:scaleX(-1) translateX(3px);}
.service-card .tag{
  position:absolute;top:24px;inset-inline-end:24px;z-index:2;font-size:10.5px;font-weight:800;
  padding:5px 11px;border-radius:100px;background:rgba(217,164,65,.15);color:var(--gold);letter-spacing:.05em;text-transform:uppercase;
}
 
/* ================= SPECIALIZED (pest/pool) ================= */
.spec-block{display:grid;grid-template-columns:1fr;gap:0;border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);}
@media(min-width:900px){.spec-block{grid-template-columns:1fr 1fr;}}
.spec-block.reverse .spec-media{order:2;}
@media(min-width:900px){.spec-block.reverse .spec-media{order:2;}.spec-block.reverse .spec-copy{order:1;}}
.spec-media{position:relative;min-height:320px;}
.spec-media video, .spec-media img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.spec-copy{background:var(--navy-900);color:#fff;padding:52px 46px;display:flex;flex-direction:column;justify-content:center;}
@media(max-width:640px){.spec-copy{padding:38px 28px;}}
.spec-copy .eyebrow{color:var(--cyan-400);}
.spec-copy .eyebrow::before{background:var(--cyan-400);}
.spec-copy h3{font-size:clamp(26px,3vw,36px);font-weight:800;margin-bottom:16px;}
.spec-copy > p{color:rgba(255,255,255,.72);margin-bottom:28px;font-size:16px;line-height:1.8;}
.spec-list{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:8px;}
@media(min-width:520px){.spec-list{grid-template-columns:1fr 1fr;}}
.spec-list li{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;color:rgba(255,255,255,.85);line-height:1.5;}
.spec-list li svg{width:18px;height:18px;flex-shrink:0;color:var(--cyan-400);margin-top:2px;}
.specialized-wrap{display:flex;flex-direction:column;gap:36px;}
 
/* ================= SECTORS ================= */
.sectors-grid{display:grid;grid-template-columns:1fr;gap:20px;}
@media(min-width:640px){.sectors-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1080px){.sectors-grid{grid-template-columns:repeat(4,1fr);}}
.sector-card{
  position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/4;
  background:linear-gradient(135deg,var(--navy-800),var(--navy-950));
}
.sector-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);opacity:.85;}
.sector-card:hover img{transform:scale(1.09);}
.sector-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(6,17,36,.1) 0%, rgba(6,17,36,.55) 55%, rgba(5,12,26,.96) 100%);}
.sector-card-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;padding:22px;}
.sector-num{font-size:13px;font-weight:800;color:rgba(255,255,255,.6);}
.sector-card h4{color:#fff;font-size:19px;font-weight:800;margin-bottom:8px;line-height:1.3;}
.sector-card p{color:rgba(255,255,255,.68);font-size:13px;line-height:1.6;max-height:0;opacity:0;overflow:hidden;transition:all .5s var(--ease);}
.sector-card:hover p{max-height:100px;opacity:1;margin-bottom:10px;}
.sector-arrow{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;transform:translateY(6px);opacity:.7;transition:all .4s var(--ease);}
.sector-card:hover .sector-arrow{background:var(--cyan-500);transform:translateY(0);opacity:1;}
.sector-arrow svg{width:15px;height:15px;color:#fff;}
html[dir="rtl"] .sector-arrow svg{transform:scaleX(-1);}
 
/* ================= WHY SHAFIYO ================= */
.why-list{display:flex;flex-direction:column;}
.why-item{
  display:grid;grid-template-columns:auto 1fr;gap:32px;padding-block:40px;
  border-top:1px solid var(--line);align-items:center;
}
.why-item:last-child{border-bottom:1px solid var(--line);}
@media(min-width:860px){.why-item{grid-template-columns:140px 1fr 240px;gap:40px;}}
.why-num{font-size:clamp(38px,4vw,58px);font-weight:900;color:var(--mist-2);line-height:1;font-family:var(--font-en);-webkit-text-stroke:1.5px var(--line-strong);color:transparent;}
.why-body h3{font-size:clamp(20px,2vw,26px);font-weight:800;color:var(--navy-900);margin-bottom:10px;}
.why-body p{color:var(--ink-soft);font-size:15.5px;line-height:1.8;max-width:560px;}
.why-media{display:none;border-radius:16px;overflow:hidden;aspect-ratio:4/3;box-shadow:var(--shadow-md);}
@media(min-width:860px){.why-media{display:block;}}
.why-media img{width:100%;height:100%;object-fit:cover;}
 
/* ================= PROCESS ================= */
.process-wrap{position:relative;}
.process-line{position:absolute;top:29px;inset-inline:0;height:2px;background:var(--line);display:none;}
@media(min-width:860px){.process-line{display:block;}}
.process-line-fill{position:absolute;top:0;inset-inline-start:0;height:100%;width:0%;background:linear-gradient(90deg,var(--cyan-500),var(--royal-600));transition:width 1.4s var(--ease);}
html[dir="rtl"] .process-line-fill{inset-inline-start:auto;inset-inline-end:0;}
.process-steps{display:grid;grid-template-columns:1fr;gap:36px;position:relative;}
@media(min-width:860px){.process-steps{grid-template-columns:repeat(4,1fr);gap:24px;}}
.process-step{text-align:start;}
.process-dot{
  width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--navy-900);
  margin-bottom:22px;position:relative;z-index:2;transition:all .5s var(--ease);font-family:var(--font-en);
}
.process-step.active .process-dot{background:linear-gradient(135deg,var(--cyan-500),var(--royal-600));border-color:transparent;color:#fff;box-shadow:0 10px 24px -8px rgba(23,184,201,.6);}
.process-step h4{font-size:19px;font-weight:800;color:var(--navy-900);margin-bottom:8px;}
.process-step p{font-size:14.5px;color:var(--ink-soft);line-height:1.7;max-width:260px;}
 
/* ================= TEAMS IN ACTION ================= */
.teams-header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:44px;}
.teams-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:720px){.teams-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1080px){.teams-grid{grid-template-columns:2fr 1fr 1fr;grid-template-rows:auto auto;}}
.team-tile{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;background:var(--navy-950);aspect-ratio:4/3;}
@media(min-width:1080px){.team-tile.feature{grid-row:span 2;aspect-ratio:auto;}}
.team-tile video, .team-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.team-tile:hover img, .team-tile:hover video{transform:scale(1.06);}
.team-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,12,26,.05), rgba(5,12,26,.8));}
.team-tile-label{position:absolute;bottom:0;inset-inline:0;z-index:2;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.team-tile-label span{color:#fff;font-weight:700;font-size:15px;}
.play-btn{
  width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(255,255,255,.3);
  transition:all .3s var(--ease);
}
.team-tile:hover .play-btn{background:var(--cyan-500);transform:scale(1.08);}
.play-btn svg{width:16px;height:16px;color:#fff;margin-inline-start:2px;}
html[dir="rtl"] .play-btn svg{margin-inline-start:0;margin-inline-end:2px;transform:scaleX(-1);}
.team-tile.playing .play-btn{opacity:0;}
 
/* ================= WHATSAPP FLOAT ================= */
.wa-float{
  position:fixed;bottom:26px;inset-inline-end:26px;z-index:90;
  width:62px;height:62px;border-radius:50%;background:#1fae5b;
  display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -8px rgba(31,174,91,.6);
  transition:transform .3s var(--ease);
}
.wa-float:hover{transform:scale(1.08);}
.wa-float svg{width:30px;height:30px;color:#fff;}
.wa-float::before{
  content:"";position:absolute;inset:0;border-radius:50%;background:#1fae5b;opacity:.5;
  animation:waPulse 2.4s infinite;
}
@keyframes waPulse{0%{transform:scale(1);opacity:.5;}100%{transform:scale(1.6);opacity:0;}}
@media(max-width:640px){.wa-float{width:54px;height:54px;bottom:18px;inset-inline-end:18px;}.wa-float svg{width:26px;height:26px;}}
/* ================= MOBILE NAVBAR FIX ================= */
@media(max-width:480px){
  .navbar .container{gap:8px;padding-inline:14px;}
  .nav-logo{gap:8px;}
  .nav-logo img{height:42px;}
  .nav-logo-text b{font-size:13px;}
  .nav-logo-text span{display:none;}
  #navWaBtn{display:none;}
  .lang-toggle button{padding:5px 10px;font-size:11px;}
  .burger{width:38px;height:38px;}
}
 
/* ================= CONTACT ================= */
.contact-section{background:var(--mist);}
.contact-grid{display:grid;grid-template-columns:1fr;gap:44px;}
@media(min-width:960px){.contact-grid{grid-template-columns:0.85fr 1.15fr;gap:56px;}}
.contact-info-card{background:var(--navy-950);border-radius:26px;padding:44px 38px;color:#fff;position:relative;overflow:hidden;}
.contact-info-card::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 100% 0%, rgba(23,184,201,.25), transparent 60%);}
.contact-info-card > *{position:relative;z-index:2;}
.contact-info-card h3{font-size:24px;font-weight:800;margin-bottom:10px;}
.contact-info-card > p{color:rgba(255,255,255,.7);margin-bottom:32px;font-size:15px;line-height:1.7;}
.contact-line{display:flex;align-items:center;gap:14px;padding-block:16px;border-top:1px solid rgba(255,255,255,.14);}
.contact-line .ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-line .ic svg{width:19px;height:19px;color:var(--cyan-400);}
.contact-line div span{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:2px;}
.contact-line div b{font-size:15px;font-weight:700;}
.contact-quick{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;}
.form-card{background:#fff;border-radius:26px;padding:44px 38px;box-shadow:var(--shadow-md);}
@media(max-width:640px){.contact-info-card,.form-card{padding:30px 24px;}}
.form-row{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:20px;}
@media(min-width:560px){.form-row.two{grid-template-columns:1fr 1fr;}}
.field label{display:block;font-size:13.5px;font-weight:700;color:var(--navy-900);margin-bottom:8px;}
.field input, .field select, .field textarea{
  width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line-strong);
  font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--mist);
  transition:border-color .3s, background .3s;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--cyan-500);background:#fff;}
.field textarea{resize:vertical;min-height:110px;}
.field.error input, .field.error select, .field.error textarea{border-color:#e2534d;}
.field .err-msg{display:none;color:#e2534d;font-size:12.5px;margin-top:6px;font-weight:600;}
.field.error .err-msg{display:block;}
.form-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px;}
.form-note{font-size:12.5px;color:var(--ink-soft);}
.form-success{display:none;align-items:center;gap:12px;background:#eafaf1;border:1px solid #b8ecce;color:#1a7a45;padding:16px 18px;border-radius:14px;font-size:14px;font-weight:600;margin-bottom:20px;}
.form-success.show{display:flex;}
.form-success svg{width:20px;height:20px;flex-shrink:0;}
 
/* ================= FOOTER ================= */
.footer{background:var(--navy-950);color:#fff;padding-block:80px 30px;position:relative;overflow:hidden;}
.footer::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at 10% 0%, rgba(23,184,201,.12), transparent 60%);}
.footer > .container{position:relative;z-index:2;}
.footer-top{display:grid;grid-template-columns:1fr;gap:48px;padding-bottom:56px;border-bottom:1px solid rgba(255,255,255,.1);}
@media(min-width:860px){.footer-top{grid-template-columns:1.4fr 0.8fr 1fr;gap:40px;}}
.footer-brand{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.footer-brand img{height:44px;width:auto;}
.footer-brand b{display:block;font-size:19px;font-weight:800;}
.footer-brand span{display:block;font-size:12px;opacity:.65;}
.footer-tagline{color:var(--cyan-300);font-weight:700;font-size:14.5px;margin-bottom:16px;}
.footer p.desc{color:rgba(255,255,255,.6);font-size:14.5px;line-height:1.8;max-width:340px;}
.footer h5{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:22px;}
.footer-links li{margin-bottom:14px;}
.footer-links a{color:rgba(255,255,255,.78);font-size:14.5px;transition:color .3s;}
.footer-links a:hover{color:var(--cyan-400);}
.footer-contact li{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:14.5px;color:rgba(255,255,255,.78);}
.footer-contact svg{width:17px;height:17px;color:var(--cyan-400);flex-shrink:0;}
.footer-social{display:flex;gap:10px;margin-top:20px;}
.footer-social a{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:all .3s var(--ease);}
.footer-social a:hover{background:var(--cyan-500);transform:translateY(-3px);}
.footer-social svg{width:19px;height:19px;}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding-top:26px;font-size:13px;color:rgba(255,255,255,.45);}
 
/* ================= UTIL ================= */
.grid-2{display:grid;grid-template-columns:1fr;gap:24px;}
@media(min-width:768px){.grid-2{grid-template-columns:1fr 1fr;}}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
::selection{background:var(--cyan-400);color:#fff;}
:focus-visible{outline:3px solid var(--cyan-400);outline-offset:2px;}
</style>
</head>
<body>
 
<!-- ============ NAVBAR ============ -->

      <button class="burger" id="burgerBtn" aria-label="Menu"><span></span></button>

  </div>
</header>
 
<div class="mobile-menu" id="mobileMenu">
  <nav id="mobileLinks" style="display:flex;flex-direction:column;"></nav>
  <a class="btn btn-primary" id="mobileWaBtn" target="_blank" rel="noopener"></a>
</div>
 
<!-- ============ HERO ============ -->
<section class="hero" id="home">
  <div class="hero-media">
    <video id="heroVideo" autoplay muted loop playsinline poster="assets/poster/hotel_cleaning.jpg">
      <source src="assets/video/hotel_cleaning.mp4" type="video/mp4">
    </video>
  </div>
  <div class="container hero-inner">
    <div class="hero-tag reveal in"><span class="dot"></span><span id="heroTag"></span></div>
    <h1 class="reveal in" id="heroTitle" style="transition-delay:.1s"></h1>
    <p class="sub reveal in" id="heroSub" style="transition-delay:.2s"></p>
    <div class="hero-ctas reveal in" style="transition-delay:.3s">
      <a href="#contact" class="btn btn-primary" id="heroCta1"></a>
      <a href="#services" class="btn btn-ghost" id="heroCta2"></a>

      <div class="scroll-indicator"><span id="scrollText"></span><span class="line"></span></div>
    </div>
  </div>
</section>
 
<!-- ============ ABOUT ============ -->
<section class="section" id="about">
  <div class="container">
    <div class="about-grid">
      <div class="reveal-scale">
        <div class="about-media">
          <video muted loop playsinline autoplay poster="assets/poster/property_cleaning.jpg">
            <source src="assets/video/property_cleaning.mp4" type="video/mp4">
          </video>
        </div>
      </div>
      <div>
        <div class="section-head reveal">
          <div class="eyebrow" id="aboutEyebrow"></div>
          <h2 class="h2" id="aboutHeading"></h2>
        </div>
        <div class="about-copy reveal" id="aboutCopy"></div>
        <div class="value-chips reveal" id="valueChips"></div>
      </div>
    </div>
  </div>
</section>
 
<!-- ============ MISSION / VISION ============ -->
<section class="section mv-section">
  <div class="container">
    <div class="mv-grid">
      <div class="mv-card reveal">
        <div class="glyph"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg></div>
        <span class="num" id="missionLabel"></span>
        <h3 id="missionTitle"></h3>
        <p id="missionBody"></p>
      </div>
      <div class="mv-card reveal" style="transition-delay:.12s">
        <div class="glyph"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <span class="num" id="visionLabel"></span>
        <h3 id="visionTitle"></h3>
        <p id="visionBody"></p>
      </div>
    </div>
  </div>
</section>
 
<!-- ============ SERVICES ============ -->
<section class="section" id="services">
  <div class="container">
    <div class="section-head center reveal">
      <div class="eyebrow" id="servicesEyebrow"></div>
      <h2 class="h2" id="servicesHeading"></h2>
      <p class="lead" style="margin-inline:auto;margin-top:16px;" id="servicesLead"></p>
    </div>
    <div class="services-grid reveal-scale" id="servicesGrid"></div>
  </div>
</section>
 
<!-- ============ SPECIALIZED SERVICES (pest + pool) ============ -->
<section class="section" id="specialized" style="padding-top:0;">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" id="specEyebrow"></div>
      <h2 class="h2" id="specHeading"></h2>
    </div>
    <div class="specialized-wrap">
      <div class="spec-block reveal" id="pestBlock">
        <div class="spec-media">
          <video muted loop playsinline autoplay poster="assets/poster/pest_control.jpg">
            <source src="assets/video/pest_control.mp4" type="video/mp4">
          </video>
        </div>
        <div class="spec-copy">
          <div class="eyebrow" id="pestEyebrow"></div>
          <h3 id="pestTitle"></h3>
          <p id="pestDesc"></p>
          <ul class="spec-list" id="pestList"></ul>
        </div>
      </div>
      <div class="spec-block reverse reveal" id="poolBlock">
        <div class="spec-media">
          <video muted loop playsinline autoplay poster="assets/poster/swimming_pool_cleaning.jpg">
            <source src="assets/video/swimming_pool_cleaning.mp4" type="video/mp4">
          </video>
        </div>
        <div class="spec-copy">
          <div class="eyebrow" id="poolEyebrow"></div>
          <h3 id="poolTitle"></h3>
          <p id="poolDesc"></p>
          <ul class="spec-list" id="poolList"></ul>
        </div>
      </div>
    </div>
  </div>
</section>
 
<!-- ============ SECTORS ============ -->
<section class="section" id="sectors" style="background:var(--mist);">
  <div class="container">
    <div class="section-head center reveal">
      <div class="eyebrow" id="sectorsEyebrow"></div>
      <h2 class="h2" id="sectorsHeading"></h2>
      <p class="lead" style="margin-inline:auto;margin-top:16px;" id="sectorsLead"></p>
    </div>
    <div class="sectors-grid reveal-scale" id="sectorsGrid"></div>
  </div>
</section>
 
<!-- ============ WHY SHAFIYO ============ -->
<section class="section" id="why">
  <div class="container">
    <div class="section-head reveal">
      <div class="eyebrow" id="whyEyebrow"></div>
      <h2 class="h2" id="whyHeading"></h2>
    </div>
    <div class="why-list" id="whyList"></div>
  </div>
</section>
 
<!-- ============ PROCESS ============ -->
<section class="section" style="background:var(--mist);">
  <div class="container">
    <div class="section-head center reveal">
      <div class="eyebrow" id="processEyebrow"></div>
      <h2 class="h2" id="processHeading"></h2>
    </div>
    <div class="process-wrap reveal">
      <div class="process-line"><div class="process-line-fill" id="processFill"></div></div>
      <div class="process-steps" id="processSteps"></div>
    </div>
  </div>
</section>
 
<!-- ============ TEAMS IN ACTION ============ -->
<section class="section" id="teams">
  <div class="container">
    <div class="teams-header reveal">
      <div>
        <div class="eyebrow" id="teamsEyebrow"></div>
        <h2 class="h2" id="teamsHeading"></h2>
      </div>
      <p class="lead" id="teamsLead"></p>
    </div>
    <div class="teams-grid reveal-scale" id="teamsGrid"></div>
  </div>
</section>
 
<!-- ============ CONTACT ============ -->
<section class="section contact-section" id="contact">

    <div class="section-head center reveal">
      <div class="eyebrow" id="contactEyebrow"></div>
      <h2 class="h2" id="contactHeading"></h2>

    </div>

      <div class="contact-info-card reveal">
        <h3 id="contactInfoTitle"></h3>
        <p id="contactInfoDesc"></p>
        <div id="contactLines"></div>
        <div class="contact-quick" id="contactQuick"></div>
      </div>
      <div class="form-card reveal" style="transition-delay:.1s">
        <div class="form-success" id="formSuccess">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>

              <input type="tel" name="phone" autocomplete="tel">
              <div class="err-msg" id="e-phone"></div>
            </div>
          </div>
          <div class="form-row two">
            <div class="field" id="f-email">
              <label id="l-email"></label>
              <input type="email" name="email" autocomplete="email">
              <div class="err-msg" id="e-email"></div>
            </div>
            <div class="field" id="f-service">
              <label id="l-service"></label>
              <select name="service" id="serviceSelect"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="field" id="f-message">
              <label id="l-message"></label>
              <textarea name="message"></textarea>
            </div>
          </div>
          <div class="form-foot">
            <button type="submit" class="btn btn-primary" id="formSubmit"></button>
            <span class="form-note" id="formNote"></span>
          </div>
        </form>
      </div>
    </div>
  </div>

<footer class="footer">
  <div class="container">
    <div class="footer-top">
      <div>
        <div class="footer-brand">
          <img src="assets/img/logo-192.png" alt="Shafiyo Cleaning Services">
          <span><b id="footBrand"></b><span id="footBrandType"></span></span>
        </div>
        <div class="footer-tagline" id="footTagline"></div>
        <p class="desc" id="footDesc"></p>
      </div>
      <div>
        <h5 id="footNavTitle"></h5>

        <h5 id="footContactTitle"></h5>

        <div class="footer-social" id="footSocial"></div>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="footCopy"></span>
      <span id="footBy"></span>
    </div>

/* hover-to-play for service cards */
function bindServiceHover(){
  document.querySelectorAll(".service-card").forEach(card=>{
    const v = card.querySelector("video");
    card.addEventListener("mouseenter", ()=>{
      if(!v.src && v.dataset.src){ v.src = v.dataset.src; }
      v.play().catch(()=>{});
    });
    card.addEventListener("mouseleave", ()=>{ v.pause(); });
    card.addEventListener("click", (e)=>{
      const target = card.dataset.goto;
      if(target){ e.preventDefault(); document.querySelector(target)?.scrollIntoView({behavior:"smooth"}); }
    });
  });
}
 
/* click-to-play for team tiles */
function bindTeamTiles(){
  document.querySelectorAll(".team-tile").forEach(tile=>{
    const v = tile.querySelector("video");
    tile.addEventListener("click", ()=>{
      if(!v.src && v.dataset.src){ v.src = v.dataset.src; }
      if(v.paused){ v.play().catch(()=>{}); tile.classList.add("playing"); }
      else { v.pause(); tile.classList.remove("playing"); }
    });
  });
}
 
/* scroll reveal */
let revealObserver;
function initRevealObserver(){
  if(revealObserver) revealObserver.disconnect();
  const els = document.querySelectorAll(".reveal, .reveal-scale");
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add("in"); revealObserver.unobserve(entry.target); }
    });
  }, {threshold:0.12, rootMargin:"0px 0px -60px 0px"});
  els.forEach(el=>revealObserver.observe(el));
}
 
/* process line fill on scroll into view */
function initProcessObserver(){
  const wrap = document.querySelector(".process-wrap");
  if(!wrap) return;
  const fill = document.getElementById("processFill");
  const steps = document.querySelectorAll(".process-step");
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        fill.style.width = "100%";
        steps.forEach((s,i)=> setTimeout(()=> s.classList.add("active"), i*220));
        obs.unobserve(entry.target);
      }
    });
  }, {threshold:0.3});
  obs.observe(wrap);
}

window.addEventListener("scroll", ()=>{

}, {passive:true});

  mobileMenu.classList.toggle("open");

/* language toggle */
document.getElementById("langToggle").addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-lang]");
  if(!btn) return;
  const newLang = btn.dataset.lang;
  if(newLang === lang) return;
  lang = newLang;
  render();
});
 
/* contact form -> whatsapp */
document.addEventListener("submit", function(e){
  if(e.target.id !== "quoteForm") return;
  e.preventDefault();
  const c = content[lang];
  const form = e.target;
  const name = form.name.value.trim();
  const phone = form.phone.value.trim();
  const email = form.email.value.trim();
  const service = form.service.value;
  const message = form.message.value.trim();
 
  let valid = true;
  const fName = document.getElementById("f-name");
  const fPhone = document.getElementById("f-phone");
  const fEmail = document.getElementById("f-email");
  fName.classList.remove("error"); fPhone.classList.remove("error"); fEmail.classList.remove("error");
 
  if(name.length < 2){ fName.classList.add("error"); valid = false; }
  const phoneDigits = phone.replace(/[^\d+]/g,"");
  if(phoneDigits.length < 7){ fPhone.classList.add("error"); valid = false; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ fEmail.classList.add("error"); valid = false; }
 
  if(!valid) return;
 
  const successBox = document.getElementById("formSuccess");
  successBox.classList.add("show");
 
  const lines = lang === "ar"
    ? [`مرحباً، أرغب بطلب عرض سعر مجاني من شافيو لخدمات التنظيف.`,`الاسم: ${name}`,`الهاتف: ${phone}`, email ? `البريد: ${email}` : null, `الخدمة: ${service}`, message ? `تفاصيل: ${message}` : null]
    : [`Hello, I'd like to request a free quote from Shafiyo Cleaning Services.`,`Name: ${name}`,`Phone: ${phone}`, email ? `Email: ${email}` : null, `Service: ${service}`, message ? `Details: ${message}` : null];
  const waText = lines.filter(Boolean).join("\n");
 
  setTimeout(()=>{ window.open(waLink(waText), "_blank"); }, 500);
});

render();

},{threshold:0.1});
heroObs.observe(document.getElementById("home"));
